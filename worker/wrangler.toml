# ============================================================
# wrangler.toml · Cloudflare Worker 配置（D1 后端地基）
# ============================================================
name = "vibeshowcase-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 生产部署时绑定 D1
[[d1_databases]]
binding = "DB"
database_name = "vibeshowcase"
database_id = "08c82a73-a9e2-4878-b178-c5e7fe78d93c"

# 管理密钥在部署时通过环境注入（不可提交明文）：
#   npx wrangler secret put ADMIN_KEY