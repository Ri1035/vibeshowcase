# ============================================================
# wrangler.toml · Cloudflare Worker 配置（D1 后端地基）
# 使用前：
#   1. 创建 D1 数据库并填入 database_id：
#        npx wrangler d1 create vibeshowcase
#   2. 复制 database_id 到下方 [d1_databases] binding
#   3. 初始化表：
#        npx wrangler d1 execute vibeshowcase --file=worker/schema.sql
#   4. 本地开发：
#        npx wrangler dev --config worker/wrangler.toml
# ============================================================
name = "vibeshowcase-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# API 部署子路径，前端通过同一域名 /api/* 访问
routes = [
  { pattern = "api.mysite.com/*", zone_name = "mysite.com" }
]

[[d1_databases]]
binding = "DB"                # Worker 内通过 env.DB 访问
database_name = "vibeshowcase"
database_id = "PASTE_YOUR_D1_DATABASE_ID_HERE"

# 若需暴露访问统计/日志，可用以下（可选）
# [observability]
# enabled = true
# head_sampling_rate = 0.1